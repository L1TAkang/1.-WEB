<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 콘텐츠 자동생성기</title>
    <!-- Pretendard 폰트 로드 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Pretendard 폰트 적용 */
        body {
            font-family: 'Pretendard', sans-serif;
        }
        /* Custom Message Box Styles */
        .message-box-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            visibility: hidden; /* Hidden by default */
            opacity: 0;
            transition: visibility 0s, opacity 0.3s ease;
        }

        .message-box-overlay.show {
            visibility: visible;
            opacity: 1;
        }

        .message-box-content {
            background-color: #fff;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 350px;
            width: 90%;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }

        .message-box-overlay.show .message-box-content {
            transform: translateY(0);
        }

        .message-box-content p {
            font-size: 16px;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .message-box-content button {
            background-color: #36474F;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .message-box-content button:hover {
            background-color: #2a363d;
        }

        /* Toggle specific styles */
        .toggle-header {
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: #f0f0f0;
            border-radius: 8px;
            font-weight: bold;
            color: #333;
            transition: background-color 0.2s ease;
        }
        .toggle-header:hover {
            background-color: #e0e0e0;
        }
        .toggle-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            padding: 0 16px;
        }
        .toggle-content.open {
            max-height: 500px; /* Sufficiently large to show content */
            padding: 16px;
        }
        .toggle-arrow {
            transition: transform 0.3s ease;
        }
        .toggle-header.open .toggle-arrow {
            transform: rotate(180deg);
        }

        /* Content Module 1 Specific Styles */
        .content-module-1 {
            width: 1200px; /* Base width for calculation and download */
            background-color: #ffffff;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 40px; /* Increased gap between sections */
            position: relative;
            border: 2px solid #36474F;
            padding: 25px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            /* margin: 0 auto; removed, centering handled by parent flexbox */
            /* transform will be applied by JS for preview scaling */
            transform-origin: top left; /* Default origin for scaling */
        }

        .content-module-1 .main-title {
            font-size: 70px; /* USP font size changed to 70px */
            font-weight: bold;
            line-height: 1.5; /* Line height increased */
            margin-bottom: 0; /* Adjusted margin */
            white-space: pre-wrap; /* Preserve whitespace and wrap */
            text-align: left; /* Left-align USP text */
        }

        .content-module-1 .description-text {
            font-size: 50px; /* Product description font size increased to 50px */
            line-height: 1.8; /* Line height increased */
            word-break: keep-all;
            overflow-wrap: break-word;
            white-space: pre-wrap; /* Preserve whitespace and wrap */
            letter-spacing: -0.04em; /* Letter spacing narrowed further */
        }

        .content-module-1 .product-image-container {
            position: relative;
            width: 100%;
            padding-bottom: 125%; /* Image aspect ratio changed to 4:5 (125%) */
            overflow: hidden;
            background-color: #f0f0f0;
        }
        .content-module-1 .product-image-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Hide the bottom details for lookbook module as per request */
        .content-module-1 .bottom-details {
            display: none;
        }

        /* Active tab styling */
        .tab-button.active {
            background-color: #36474F;
            color: #ffffff;
        }

        /* Ensure responsive behavior for smaller screens */
        @media (max-width: 1280px) {
            /* No direct width change here, relies on JS transform now */
        }

        @media (max-width: 768px) {
            .main-title {
                font-size: 28px !important; /* Adjust for mobile if needed */
            }
            .description-text {
                font-size: 18px !important; /* Adjust for mobile if needed */
            }
        }

        /* Custom style for small square color input */
        .color-square-input {
            width: 32px; /* Fixed width for square */
            height: 32px; /* Fixed height for square */
            padding: 0; /* Remove padding to make it truly square */
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            /* Ensure it aligns well with text input */
            margin-left: 8px; /* Space between text input and color input */
            flex-shrink: 0; /* Prevent shrinking */
        }
    </style>
</head>
<body class="bg-gray-100 p-8 flex flex-col items-center min-h-screen">
    <!-- Adjusted max-width for the overall container to accommodate 1200px content + left panel -->
    <div class="flex flex-col md:flex-row w-full gap-8" style="max-width: 1700px;">
        <!-- Left Panel: Fixed width for md screens -->
        <div class="flex-shrink-0 w-full md:w-[400px] space-y-6">
            <!-- 상품 정보 (Product Information) -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-2xl font-bold text-gray-800 mb-4">상품 정보</h2>
                <div id="productInfoContainer" class="space-y-4">
                    <!-- Product info toggles will be rendered here by JS -->
                </div>
            </div>

            <!-- 콘텐츠 작성 정보 (Content Creation Information) -->
            <div class="bg-white p-6 rounded-lg shadow-md mt-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-4">콘텐츠 작성 정보</h2>

                <!-- Module 1 Inputs (Content 1) -->
                <div id="module1Inputs" class="content-input-section">
                    <div class="mb-4">
                        <label for="productSelect" class="block text-lg font-semibold text-gray-700 mb-2">상품 선택</label>
                        <select id="productSelect" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 p-2">
                            <!-- Product selection options will be rendered here by JS -->
                        </select>
                    </div>

                    <div class="space-y-4">
                        <div class="input-group">
                            <label for="uspLine1" class="block text-sm font-medium text-gray-700">USP:</label>
                            <div class="flex items-center mt-1">
                                <textarea id="uspLine1" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 p-2 min-h-[60px]">바쁜 아침, 한 벌로 스타일링 완성
세련된 플리츠 디자인으로 출근길을 더욱 여유롭게</textarea>
                                <input type="color" id="uspLine1TextColor" value="#333333" class="color-square-input">
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="description" class="block text-sm font-medium text-gray-700">콘텐츠 설명:</label>
                            <div class="flex items-center mt-1">
                                <textarea id="description" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 p-2 min-h-[100px]">바쁜 아침에도 스타일링 고민 없이 완벽한 룩을 연출해 보세요. 유러피안 린넨 플리츠 니트탑은 세련된 플리츠 디자인으로 어떤 하의와도 잘 어울려 출근길을 더욱 여유롭고 특별하게 만들어 드립니다. 편안함과 스타일을 동시에 선사하는 이 니트탑으로 당신의 아침을 더욱 빛내세요.</textarea>
                                <input type="color" id="descriptionTextColor" value="#333333" class="color-square-input">
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="productImage" class="block text-sm font-medium text-gray-700">이미지 업로드:</label>
                            <input type="file" id="productImage" accept="image/*" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                        </div>
                        <div class="input-group">
                            <label for="lookbookBgColor" class="block text-sm font-medium text-gray-700">배경 색깔:</label>
                            <input type="color" id="lookbookBgColor" value="#ffffff" class="mt-1 block w-full h-10 rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 p-1">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Panel: Content Preview -->
        <!-- Flexible but with a min-width to ensure 1200px content fits -->
        <div class="w-full bg-white p-6 rounded-lg shadow-md flex-grow" style="min-width: 1250px;">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">콘텐츠</h2>
            <!-- Content Layout Tabs -->
            <div class="flex border-b border-gray-200 mb-4">
                <button class="tab-button px-4 py-2 text-gray-600 font-semibold rounded-t-lg hover:bg-gray-100 active" data-tab="1">1</button>
                <button class="tab-button px-4 py-2 text-gray-600 font-semibold rounded-t-lg hover:bg-gray-100" data-tab="2">2</button>
                <button class="tab-button px-4 py-2 text-gray-600 font-semibold rounded-t-lg hover:bg-gray-100" data-tab="3">3</button>
                <button class="tab-button px-4 py-2 text-gray-600 font-semibold rounded-t-lg hover:bg-gray-100" data-tab="4">4</button>
            </div>

            <!-- Combined Preview Scale and Action Buttons for horizontal alignment -->
            <div class="flex justify-between items-center mb-4">
                <!-- Preview Scale Input -->
                <div class="input-group w-full max-w-xs mr-4"> <!-- Added mr-4 for spacing -->
                    <label for="previewScale" class="block text-sm font-medium text-gray-700 mb-1">미리보기 배율:</label>
                    <select id="previewScale" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 p-2">
                        <option value="1.0">100%</option>
                        <option value="0.75" selected>75%</option>
                        <option value="0.5">50%</option>
                    </select>
                </div>
                <!-- Update and Download Buttons -->
                <div class="flex gap-2">
                    <button class="update-button bg-green-600 text-white py-2 px-4 rounded-md font-semibold hover:bg-green-700 transition duration-300" id="updatePreview">업데이트</button>
                    <button class="copy-button bg-gray-700 text-white py-2 px-4 rounded-md font-semibold hover:bg-gray-800 transition duration-300" id="downloadContent">다운로드</button> <!-- Text changed to '다운로드' -->
                </div>
            </div>

            <!-- Content Display Area (Tabs Content) - Now a flex container for centering -->
            <div id="contentDisplayArea" class="min-h-[400px] flex justify-center items-start">
                <!-- Content for Tab 1 (Content 1 Module) -->
                <div id="tabContent1" class="tab-content active w-full">
                    <div class="content-module-1" id="content1Module">
                        <div class="main-title" id="displayMainTitle">
                            바쁜 아침, 한 벌로 스타일링 완성
세련된 플리츠 디자인으로 출근길을 더욱 여유롭게
                        </div>
                        <div class="product-image-container">
                            <img id="displayProductImage" src="https://placehold.co/1200x1500/E0E0E0/333333?text=Product+Image" alt="유러피안 린넨 플리츠 니트탑">
                        </div>
                        <div class="description-text" id="displayDescription">
                            바쁜 아침에도 스타일링 고민 없이 완벽한 룩을 연출해 보세요. 유러피안 린넨 플리츠 니트탑은 세련된 플리츠 디자인으로 어떤 하의와도 잘 어울려 출근길을 더욱 여유롭고 특별하게 만들어 드립니다. 편안함과 스타일을 동시에 선사하는 이 니트탑으로 당신의 아침을 더욱 빛내세요.
                        </div>
                    </div>
                </div>
                <!-- Content for Tab 2 (Placeholder) -->
                <div id="tabContent2" class="tab-content hidden w-full">
                    <p class="text-gray-500 text-center py-10">콘텐츠 레이아웃 2</p>
                </div>
                <!-- Content for Tab 3 (Placeholder) -->
                <div id="tabContent3" class="tab-content hidden w-full">
                    <p class="text-gray-500 text-center py-10">콘텐츠 레이아웃 3</p>
                </div>
                <!-- Content for Tab 4 (Placeholder) -->
                <div id="tabContent4" class="tab-content hidden w-full">
                    <p class="text-gray-500 text-center py-10">콘텐츠 레이아웃 4</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Message Box HTML -->
    <div id="messageBoxOverlay" class="message-box-overlay">
        <div class="message-box-content">
            <p id="messageBoxText"></p>
            <button id="messageBoxCloseButton">확인</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // --- DOM Elements ---
            const productInfoContainer = document.getElementById('productInfoContainer');
            const productSelect = document.getElementById('productSelect');

            // Module 1 Inputs (Content 1)
            const module1Inputs = document.getElementById('module1Inputs');
            const uspLine1Input = document.getElementById('uspLine1');
            const descriptionInput = document.getElementById('description');
            const productImageInput = document.getElementById('productImage');
            const lookbookBgColorInput = document.getElementById('lookbookBgColor');
            const uspLine1TextColorInput = document.getElementById('uspLine1TextColor');
            const descriptionTextColorInput = document.getElementById('descriptionTextColor');
            const previewScaleInput = document.getElementById('previewScale');

            // Display elements for Content 1 Module
            const displayMainTitle = document.getElementById('displayMainTitle');
            const displayDescription = document.getElementById('displayDescription');
            const displayProductImage = document.getElementById('displayProductImage');
            const content1Module = document.getElementById('content1Module');

            const tabButtons = document.querySelectorAll('.tab-button');
            const tabContents = document.querySelectorAll('.tab-content');
            const updatePreviewButton = document.getElementById('updatePreview');
            const downloadContentButton = document.getElementById('downloadContent');

            const messageBoxOverlay = document.getElementById('messageBoxOverlay');
            const messageBoxText = document.getElementById('messageBoxText');
            const messageBoxCloseButton = document.getElementById('messageBoxCloseButton');

            // --- Data Storage ---
            let products = [
                {
                    brandName: '아뜰리에 마졸리',
                    productName: '유러피안 린넨 플리츠 니트탑',
                    price: '15,960원',
                    discountRate: '60%',
                    productInfo: '유러피안 린넨 플리츠 니트탑은 세련된 플리츠 디자인으로 어떤 하의와도 잘 어울려 출근길을 더욱 여유롭고 특별하게 만들어 드립니다. 편안함과 스타일을 동시에 선사하는 이 니트탑으로 당신의 아침을 더욱 빛내세요.'
                },
                {
                    brandName: '브랜드B',
                    productName: '상품B',
                    price: '25,000원',
                    discountRate: '10%',
                    productInfo: '상품B에 대한 상세 정보입니다. 이 상품은 매우 좋습니다.'
                },
                {
                    brandName: '브랜드C',
                    productName: '상품C',
                    price: '30,000원',
                    discountRate: '20%',
                    productInfo: '상품C에 대한 상세 정보입니다. 특별한 기능을 가지고 있습니다.'
                },
                {
                    brandName: '브랜드D',
                    productName: '상품D',
                    price: '45,000원',
                    discountRate: '5%',
                    productInfo: '상품D에 대한 상세 정보입니다. 마지막 상품입니다.'
                }
            ];

            let selectedProductIndexModule1 = 0; // For module 1's product selection
            const BASE_CONTENT_WIDTH = 1200; // Base width of the content module (for download)

            // --- Helper Functions ---

            /**
             * Shows a custom message box with the given message.
             * @param {string} message - The message to display.
             */
            function showMessageBox(message) {
                messageBoxText.textContent = message;
                messageBoxOverlay.classList.add('show');
            }

            // Closes the custom message box.
            messageBoxCloseButton.addEventListener('click', function() {
                messageBoxOverlay.classList.remove('show');
            });

            /**
             * Renders the product information toggles in the left panel.
             */
            function renderProductInfoToggles() {
                productInfoContainer.innerHTML = '';
                products.forEach((product, index) => {
                    const toggleDiv = document.createElement('div');
                    toggleDiv.classList.add('border', 'border-gray-300', 'rounded-lg', 'overflow-hidden');

                    const toggleHeader = document.createElement('div');
                    toggleHeader.classList.add('toggle-header');
                    toggleHeader.innerHTML = `
                        <span>상품 정보 ${index + 1}</span>
                        <span class="toggle-arrow">&#9660;</span>
                    `;
                    toggleHeader.addEventListener('click', () => toggleProductInfo(index));

                    const toggleContent = document.createElement('div');
                    toggleContent.classList.add('toggle-content', 'space-y-3', 'bg-gray-50');
                    toggleContent.id = `productToggleContent${index}`;
                    toggleContent.innerHTML = `
                        <div class="input-group">
                            <label for="brandName${index}" class="block text-sm font-medium text-gray-700">브랜드명:</label>
                            <input type="text" id="brandName${index}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2" value="${product.brandName}">
                        </div>
                        <div class="input-group">
                            <label for="productName${index}" class="block text-sm font-medium text-gray-700">상품명:</label>
                            <input type="text" id="productName${index}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2" value="${product.productName}">
                        </div>
                        <div class="input-group">
                            <label for="price${index}" class="block text-sm font-medium text-gray-700">가격:</label>
                            <input type="text" id="price${index}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2" value="${product.price}">
                        </div>
                        <div class="input-group">
                            <label for="discountRate${index}" class="block text-sm font-medium text-gray-700">할인율:</label>
                            <input type="text" id="discountRate${index}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2" value="${product.discountRate}">
                        </div>
                        <div class="input-group">
                            <label for="productInfo${index}" class="block text-sm font-medium text-gray-700">상품정보:</label>
                            <textarea id="productInfo${index}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 min-h-[80px]">${product.productInfo}</textarea>
                        </div>
                    `;

                    toggleDiv.appendChild(toggleHeader);
                    toggleDiv.appendChild(toggleContent);
                    productInfoContainer.appendChild(toggleDiv);

                    toggleContent.querySelectorAll('input, textarea').forEach(input => {
                        input.addEventListener('input', (e) => {
                            const fieldName = e.target.id.replace(`${index}`, '');
                            products[index][fieldName] = e.target.value;
                            renderProductSelectionDropdowns();
                        });
                    });
                });
            }

            /**
             * Toggles the visibility of a product information section.
             * @param {number} index - The index of the product section to toggle.
             */
            function toggleProductInfo(index) {
                const content = document.getElementById(`productToggleContent${index}`);
                const header = content.previousElementSibling;
                if (content.classList.contains('open')) {
                    content.classList.remove('open');
                    header.classList.remove('open');
                } else {
                    document.querySelectorAll('.toggle-content.open').forEach(openContent => {
                        openContent.classList.remove('open');
                        openContent.previousElementSibling.classList.remove('open');
                    });
                    content.classList.add('open');
                    header.classList.add('open');
                }
            }

            /**
             * Renders product selection dropdowns for Module 1.
             */
            function renderProductSelectionDropdowns() {
                // For Module 1
                productSelect.innerHTML = '';
                products.forEach((product, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = `상품 ${index + 1} (${product.productName || '이름 없음'})`;
                    if (index === selectedProductIndexModule1) {
                        option.selected = true;
                    }
                    productSelect.appendChild(option);
                });
            }

            /**
             * Updates the content creation input fields based on the selected product for Module 1.
             */
            function updateContentCreationInputsModule1() {
                const selectedProduct = products[selectedProductIndexModule1];
                // No auto-fill for USP/description/image, as user wants to control these directly.
            }

            /**
             * Applies the selected preview scale to the content module.
             */
            function applyPreviewScale() {
                const scale = parseFloat(previewScaleInput.value);
                content1Module.style.transform = `scale(${scale})`;
                content1Module.style.transformOrigin = 'top left'; // Set origin for consistent scaling
            }

            /**
             * Updates the content and styling of the Content 1 Module.
             */
            function updateContent1Module() {
                displayMainTitle.textContent = uspLine1Input.value;
                displayDescription.textContent = descriptionInput.value;

                content1Module.style.backgroundColor = lookbookBgColorInput.value;

                displayMainTitle.style.color = uspLine1TextColorInput.value;
                displayDescription.style.color = descriptionTextColorInput.value;

                applyPreviewScale(); // Apply scale after updating content
            }

            // --- Event Listeners ---
            productImageInput.addEventListener('change', function(event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        displayProductImage.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });

            // Module 1 input listeners
            lookbookBgColorInput.addEventListener('input', updateContent1Module);
            uspLine1Input.addEventListener('input', updateContent1Module);
            descriptionInput.addEventListener('input', updateContent1Module);
            uspLine1TextColorInput.addEventListener('input', updateContent1Module);
            descriptionTextColorInput.addEventListener('input', updateContent1Module);
            previewScaleInput.addEventListener('change', updateContent1Module); // Listen to scale changes

            // Main product selection dropdown change listener for Module 1
            productSelect.addEventListener('change', (e) => {
                selectedProductIndexModule1 = parseInt(e.target.value);
                updateContentCreationInputsModule1();
            });

            // Right panel "업데이트" button - updates the currently active module (only Module 1 now)
            updatePreviewButton.addEventListener('click', () => {
                updateContent1Module();
            });

            // Tab switching logic (now for all tabs, but only tab 1 has content)
            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    tabContents.forEach(content => content.classList.add('hidden'));

                    button.classList.add('active');
                    const targetTabId = `tabContent${button.dataset.tab}`;
                    document.getElementById(targetTabId).classList.remove('hidden');

                    if (button.dataset.tab === '1') {
                        module1Inputs.classList.remove('hidden');
                        updateContent1Module();
                    } else {
                        module1Inputs.classList.add('hidden');
                    }
                });
            });

            // Image download functionality using html2canvas
            downloadContentButton.addEventListener('click', async function() {
                const activeTabElement = document.querySelector('.tab-button.active');
                let moduleToDownload = null;

                if (activeTabElement.dataset.tab === '1') {
                    moduleToDownload = content1Module;
                } else {
                    showMessageBox('현재 선택된 탭은 미리보기 콘텐츠가 없습니다. 콘텐츠 1만 다운로드 가능합니다.');
                    return;
                }

                downloadContentButton.style.display = 'none';
                updatePreviewButton.style.display = 'none';

                // Store current transform and origin
                const currentTransform = moduleToDownload.style.transform;
                const currentTransformOrigin = moduleToDownload.style.transformOrigin;

                // Temporarily reset transform for capture at original size
                moduleToDownload.style.transform = 'none';
                moduleToDownload.style.transformOrigin = 'unset';

                // Wait for DOM reflow to apply the transform reset
                await new Promise(resolve => requestAnimationFrame(resolve));

                try {
                    const canvas = await html2canvas(moduleToDownload, {
                        scale: 2, // Capture at a higher resolution for better quality
                        useCORS: true,
                        logging: false
                    });

                    const imageDataURL = canvas.toDataURL('image/png');
                    const link = document.createElement('a');
                    link.href = imageDataURL;
                    link.download = `product_content_tab_${activeTabElement.dataset.tab}.png`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showMessageBox('콘텐츠 이미지가 저장되었습니다!');
                } catch (error) {
                    console.error('이미지 저장 중 오류 발생:', error);
                    showMessageBox('이미지 저장에 실패했습니다. 다시 시도해주세요.');
                } finally {
                    // Restore original transform and origin
                    moduleToDownload.style.transform = currentTransform;
                    moduleToDownload.style.transformOrigin = currentTransformOrigin;
                    downloadContentButton.style.display = 'block';
                    updatePreviewButton.style.display = 'block';
                }
            });

            // --- Initial Render ---
            renderProductInfoToggles();
            renderProductSelectionDropdowns();
            updateContentCreationInputsModule1();
            updateContent1Module(); // Initial update for module 1 (default active)
        });
    </script>
</body>
</html>
