<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 콘텐츠 자동생성기</title>
    <!-- Pretendard 폰트 로드 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Pretendard 폰트 적용 */
        body {
            font-family: 'Pretendard', sans-serif;
        }
        /* Custom Message Box Styles */
        .message-box-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            visibility: hidden; /* Hidden by default */
            opacity: 0;
            transition: visibility 0s, opacity 0.3s ease;
        }

        .message-box-overlay.show {
            visibility: visible;
            opacity: 1;
        }

        .message-box-content {
            background-color: #fff;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 350px;
            width: 90%;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }

        .message-box-overlay.show .message-box-content {
            transform: translateY(0);
        }

        .message-box-content p {
            font-size: 16px;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .message-box-content button {
            background-color: #36474F;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .message-box-content button:hover {
            background-color: #2a363d;
        }

        /* Toggle specific styles */
        .toggle-header {
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: #f0f0f0;
            border-radius: 8px;
            font-weight: bold;
            color: #333;
            transition: background-color 0.2s ease;
        }
        .toggle-header:hover {
            background-color: #e0e0e0;
        }
        .toggle-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            padding: 0 16px;
        }
        .toggle-content.open {
            max-height: 500px; /* Sufficiently large to show content */
            padding: 16px;
        }
        .toggle-arrow {
            transition: transform 0.3s ease;
        }
        .toggle-header.open .toggle-arrow {
            transform: rotate(180deg);
        }

        /* Lookbook Module Specific Styles */
        .lookbook-module {
            width: 1200px; /* Fixed width as requested */
            background-color: #ffffff;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 25px; /* Gap between sections */
            position: relative;
            border: 2px solid #36474F;
            padding: 25px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin: 0 auto; /* Center the module */
        }

        .lookbook-module .main-title {
            font-size: 36px; /* USP font size */
            font-weight: bold;
            line-height: 1.3;
            margin-bottom: 0; /* Adjusted margin */
        }

        .lookbook-module .description-text {
            font-size: 20px; /* Product description font size */
            line-height: 1.6;
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        .lookbook-module .product-image-container {
            position: relative;
            width: 100%;
            padding-bottom: 120%; /* Example: 4:5 aspect ratio for vertical images */
            overflow: hidden;
            background-color: #f0f0f0;
        }
        .lookbook-module .product-image-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Hide the bottom details for lookbook module as per request */
        .lookbook-module .bottom-details {
            display: none;
        }

        /* Active tab styling */
        .tab-button.active {
            background-color: #36474F;
            color: #ffffff;
        }

        /* Ensure responsive behavior for smaller screens */
        @media (max-width: 1280px) {
            .lookbook-module {
                width: 100%; /* Make it fluid on smaller screens */
                max-width: 1200px; /* Keep max-width for consistency */
            }
        }

        @media (max-width: 768px) {
            .main-title {
                font-size: 28px !important; /* Adjust for mobile if needed */
            }
            .description-text {
                font-size: 18px !important; /* Adjust for mobile if needed */
            }
        }

        /* Custom style for small square color input */
        .color-square-input {
            width: 32px; /* Fixed width for square */
            height: 32px; /* Fixed height for square */
            padding: 0; /* Remove padding to make it truly square */
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            /* Ensure it aligns well with text input */
            margin-left: 8px; /* Space between text input and color input */
            flex-shrink: 0; /* Prevent shrinking */
        }
    </style>
</head>
<body class="bg-gray-100 p-8 flex flex-col items-center min-h-screen">
    <div class="flex flex-col md:flex-row w-full max-w-7xl gap-8">
        <!-- Left Panel: Product Info & Content Creation Info -->
        <div class="w-full md:w-1/3 space-y-6">
            <!-- 상품 정보 (Product Information) -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-2xl font-bold text-gray-800 mb-4">상품 정보</h2>
                <div id="productInfoContainer" class="space-y-4">
                    <!-- Product info toggles will be rendered here by JS -->
                </div>
            </div>

            <!-- 콘텐츠 작성 정보 (Content Creation Information) -->
            <div class="bg-white p-6 rounded-lg shadow-md mt-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-4">콘텐츠 작성 정보</h2>

                <!-- Module 1 Inputs (Lookbook) -->
                <div id="module1Inputs" class="content-input-section">
                    <div class="mb-4">
                        <label for="productSelect" class="block text-lg font-semibold text-gray-700 mb-2">상품 선택</label>
                        <select id="productSelect" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 p-2">
                            <!-- Product selection options will be rendered here by JS -->
                        </select>
                    </div>

                    <div class="space-y-4">
                        <div class="input-group">
                            <label for="uspLine1" class="block text-sm font-medium text-gray-700">USP (첫째 줄):</label>
                            <div class="flex items-center mt-1">
                                <input type="text" id="uspLine1" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 p-2" value="바쁜 아침, 한 벌로 스타일링 완성">
                                <input type="color" id="uspLine1TextColor" value="#333333" class="color-square-input">
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="uspLine2" class="block text-sm font-medium text-gray-700">USP (둘째 줄):</label>
                            <div class="flex items-center mt-1">
                                <input type="text" id="uspLine2" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 p-2" value="세련된 플리츠 디자인으로 출근길을 더욱 여유롭게">
                                <input type="color" id="uspLine2TextColor" value="#333333" class="color-square-input">
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="description" class="block text-sm font-medium text-gray-700">콘텐츠 설명:</label>
                            <div class="flex items-center mt-1">
                                <textarea id="description" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 p-2 min-h-[100px]">바쁜 아침에도 스타일링 고민 없이 완벽한 룩을 연출해 보세요. 유러피안 린넨 플리츠 니트탑은 세련된 플리츠 디자인으로 어떤 하의와도 잘 어울려 출근길을 더욱 여유롭고 특별하게 만들어 드립니다. 편안함과 스타일을 동시에 선사하는 이 니트탑으로 당신의 아침을 더욱 빛내세요.</textarea>
                                <input type="color" id="descriptionTextColor" value="#333333" class="color-square-input">
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="productImage" class="block text-sm font-medium text-gray-700">이미지 업로드:</label>
                            <input type="file" id="productImage" accept="image/*" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                        </div>
                        <div class="input-group">
                            <label for="lookbookBgColor" class="block text-sm font-medium text-gray-700">배경 색깔:</label>
                            <input type="color" id="lookbookBgColor" value="#ffffff" class="mt-1 block w-full h-10 rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 p-1">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Panel: Content Preview -->
        <div class="w-full md:w-2/3 bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">콘텐츠</h2>
            <!-- Content Layout Tabs -->
            <div class="flex border-b border-gray-200 mb-4">
                <button class="tab-button px-4 py-2 text-gray-600 font-semibold rounded-t-lg hover:bg-gray-100 active" data-tab="1">1</button>
                <!-- Removed other tabs -->
            </div>

            <div class="flex justify-end gap-2 mb-4">
                <button class="update-button bg-green-600 text-white py-2 px-4 rounded-md font-semibold hover:bg-green-700 transition duration-300" id="updatePreview">업데이트</button>
                <button class="copy-button bg-gray-700 text-white py-2 px-4 rounded-md font-semibold hover:bg-gray-800 transition duration-300" id="downloadContent">[다운로드]</button>
            </div>

            <!-- Content Display Area (Tabs Content) -->
            <div id="contentDisplayArea" class="border border-gray-300 p-4 rounded-md min-h-[400px] flex justify-center items-start">
                <!-- Content for Tab 1 (Lookbook) -->
                <div id="tabContent1" class="tab-content active w-full">
                    <div class="lookbook-module" id="lookbookModule">
                        <div class="main-title" id="displayMainTitle">
                            <span id="displayUspLine1">바쁜 아침, 한 벌로 완성하는</span><br>
                            <span id="displayUspLine2">세련된 플리츠 니트탑</span>
                        </div>
                        <div class="description-text" id="displayDescription">
                            바쁜 아침에도 스타일링 고민 없이 완벽한 룩을 연출해 보세요. 유러피안 린넨 플리츠 니트탑은 세련된 플리츠 디자인으로 어떤 하의와도 잘 어울려 출근길을 더욱 여유롭고 특별하게 만들어 드립니다. 편안함과 스타일을 동시에 선사하는 이 니트탑으로 당신의 아침을 더욱 빛내세요.
                        </div>
                        <div class="product-image-container">
                            <img id="displayProductImage" src="https://placehold.co/1200x1440/E0E0E0/333333?text=Product+Image" alt="유러피안 린넨 플리츠 니트탑">
                        </div>
                    </div>
                </div>
                <!-- Removed other tab contents -->
            </div>
        </div>
    </div>

    <!-- Custom Message Box HTML -->
    <div id="messageBoxOverlay" class="message-box-overlay">
        <div class="message-box-content">
            <p id="messageBoxText"></p>
            <button id="messageBoxCloseButton">확인</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // --- DOM Elements ---
            const productInfoContainer = document.getElementById('productInfoContainer');
            const productSelect = document.getElementById('productSelect');

            // Module 1 (Lookbook) Inputs
            const module1Inputs = document.getElementById('module1Inputs');
            const uspLine1Input = document.getElementById('uspLine1');
            const uspLine2Input = document.getElementById('uspLine2');
            const descriptionInput = document.getElementById('description');
            const productImageInput = document.getElementById('productImage');
            const lookbookBgColorInput = document.getElementById('lookbookBgColor');
            const uspLine1TextColorInput = document.getElementById('uspLine1TextColor');
            const uspLine2TextColorInput = document.getElementById('uspLine2TextColor');
            const descriptionTextColorInput = document.getElementById('descriptionTextColor');

            // Display elements for lookbook module (Module 1)
            const displayUspLine1 = document.getElementById('displayUspLine1');
            const displayUspLine2 = document.getElementById('displayUspLine2');
            const displayDescription = document.getElementById('displayDescription');
            const displayProductImage = document.getElementById('displayProductImage');
            const lookbookModule = document.getElementById('lookbookModule');

            const tabButtons = document.querySelectorAll('.tab-button');
            const updatePreviewButton = document.getElementById('updatePreview');
            const downloadContentButton = document.getElementById('downloadContent');

            const messageBoxOverlay = document.getElementById('messageBoxOverlay');
            const messageBoxText = document.getElementById('messageBoxText');
            const messageBoxCloseButton = document.getElementById('messageBoxCloseButton');

            // --- Data Storage ---
            let products = [
                {
                    brandName: '아뜰리에 마졸리',
                    productName: '유러피안 린넨 플리츠 니트탑',
                    price: '15,960원',
                    discountRate: '60%',
                    productInfo: '유러피안 린넨 플리츠 니트탑은 세련된 플리츠 디자인으로 어떤 하의와도 잘 어울려 출근길을 더욱 여유롭고 특별하게 만들어 드립니다. 편안함과 스타일을 동시에 선사하는 이 니트탑으로 당신의 아침을 더욱 빛내세요.'
                },
                {
                    brandName: '브랜드B',
                    productName: '상품B',
                    price: '25,000원',
                    discountRate: '10%',
                    productInfo: '상품B에 대한 상세 정보입니다. 이 상품은 매우 좋습니다.'
                },
                {
                    brandName: '브랜드C',
                    productName: '상품C',
                    price: '30,000원',
                    discountRate: '20%',
                    productInfo: '상품C에 대한 상세 정보입니다. 특별한 기능을 가지고 있습니다.'
                },
                {
                    brandName: '브랜드D',
                    productName: '상품D',
                    price: '45,000원',
                    discountRate: '5%',
                    productInfo: '상품D에 대한 상세 정보입니다. 마지막 상품입니다.'
                }
            ];

            let selectedProductIndexModule1 = 0; // For module 1's product selection

            // --- Helper Functions ---

            /**
             * Shows a custom message box with the given message.
             * @param {string} message - The message to display.
             */
            function showMessageBox(message) {
                messageBoxText.textContent = message;
                messageBoxOverlay.classList.add('show');
            }

            // Closes the custom message box.
            messageBoxCloseButton.addEventListener('click', function() {
                messageBoxOverlay.classList.remove('show');
            });

            /**
             * Renders the product information toggles in the left panel.
             */
            function renderProductInfoToggles() {
                productInfoContainer.innerHTML = '';
                products.forEach((product, index) => {
                    const toggleDiv = document.createElement('div');
                    toggleDiv.classList.add('border', 'border-gray-300', 'rounded-lg', 'overflow-hidden');

                    const toggleHeader = document.createElement('div');
                    toggleHeader.classList.add('toggle-header');
                    toggleHeader.innerHTML = `
                        <span>상품 정보 ${index + 1}</span>
                        <span class="toggle-arrow">&#9660;</span>
                    `;
                    toggleHeader.addEventListener('click', () => toggleProductInfo(index));

                    const toggleContent = document.createElement('div');
                    toggleContent.classList.add('toggle-content', 'space-y-3', 'bg-gray-50');
                    toggleContent.id = `productToggleContent${index}`;
                    toggleContent.innerHTML = `
                        <div class="input-group">
                            <label for="brandName${index}" class="block text-sm font-medium text-gray-700">브랜드명:</label>
                            <input type="text" id="brandName${index}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2" value="${product.brandName}">
                        </div>
                        <div class="input-group">
                            <label for="productName${index}" class="block text-sm font-medium text-gray-700">상품명:</label>
                            <input type="text" id="productName${index}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2" value="${product.productName}">
                        </div>
                        <div class="input-group">
                            <label for="price${index}" class="block text-sm font-medium text-gray-700">가격:</label>
                            <input type="text" id="price${index}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2" value="${product.price}">
                        </div>
                        <div class="input-group">
                            <label for="discountRate${index}" class="block text-sm font-medium text-gray-700">할인율:</label>
                            <input type="text" id="discountRate${index}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2" value="${product.discountRate}">
                        </div>
                        <div class="input-group">
                            <label for="productInfo${index}" class="block text-sm font-medium text-gray-700">상품정보:</label>
                            <textarea id="productInfo${index}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 min-h-[80px]">${product.productInfo}</textarea>
                        </div>
                    `;

                    toggleDiv.appendChild(toggleHeader);
                    toggleDiv.appendChild(toggleContent);
                    productInfoContainer.appendChild(toggleDiv);

                    toggleContent.querySelectorAll('input, textarea').forEach(input => {
                        input.addEventListener('input', (e) => {
                            const fieldName = e.target.id.replace(`${index}`, '');
                            products[index][fieldName] = e.target.value;
                            renderProductSelectionDropdowns();
                        });
                    });
                });
            }

            /**
             * Toggles the visibility of a product information section.
             * @param {number} index - The index of the product section to toggle.
             */
            function toggleProductInfo(index) {
                const content = document.getElementById(`productToggleContent${index}`);
                const header = content.previousElementSibling;
                if (content.classList.contains('open')) {
                    content.classList.remove('open');
                    header.classList.remove('open');
                } else {
                    document.querySelectorAll('.toggle-content.open').forEach(openContent => {
                        openContent.classList.remove('open');
                        openContent.previousElementSibling.classList.remove('open');
                    });
                    content.classList.add('open');
                    header.classList.add('open');
                }
            }

            /**
             * Renders product selection dropdowns for Module 1.
             */
            function renderProductSelectionDropdowns() {
                // For Module 1
                productSelect.innerHTML = '';
                products.forEach((product, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = `상품 ${index + 1} (${product.productName || '이름 없음'})`;
                    if (index === selectedProductIndexModule1) {
                        option.selected = true;
                    }
                    productSelect.appendChild(option);
                });
            }

            /**
             * Updates the content creation input fields based on the selected product for Module 1.
             */
            function updateContentCreationInputsModule1() {
                const selectedProduct = products[selectedProductIndexModule1];
                // No auto-fill for USP/description/image, as user wants to control these directly.
            }

            /**
             * Updates the content and styling of the lookbook module (Module 1).
             */
            function updateLookbookModule() {
                displayUspLine1.textContent = uspLine1Input.value;
                displayUspLine2.textContent = uspLine2Input.value;
                displayDescription.textContent = descriptionInput.value;

                lookbookModule.style.backgroundColor = lookbookBgColorInput.value;

                displayUspLine1.style.color = uspLine1TextColorInput.value;
                displayUspLine2.style.color = uspLine2TextColorInput.value;
                displayDescription.style.color = descriptionTextColorInput.value;
            }

            // --- Event Listeners ---
            productImageInput.addEventListener('change', function(event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        displayProductImage.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });

            // Module 1 input listeners
            lookbookBgColorInput.addEventListener('input', updateLookbookModule);
            uspLine1Input.addEventListener('input', updateLookbookModule);
            uspLine2Input.addEventListener('input', updateLookbookModule);
            descriptionInput.addEventListener('input', updateLookbookModule);
            uspLine1TextColorInput.addEventListener('input', updateLookbookModule);
            uspLine2TextColorInput.addEventListener('input', updateLookbookModule);
            descriptionTextColorInput.addEventListener('input', updateLookbookModule);

            // Main product selection dropdown change listener for Module 1
            productSelect.addEventListener('change', (e) => {
                selectedProductIndexModule1 = parseInt(e.target.value);
                updateContentCreationInputsModule1();
            });

            // Right panel "업데이트" button - updates the currently active module (only Module 1 now)
            updatePreviewButton.addEventListener('click', () => {
                updateLookbookModule();
            });

            // Tab switching logic (now only for Tab 1)
            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    // Deactivate all tab buttons (only one exists now, but good practice)
                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    // Hide all tab contents (only one exists now, but good practice)
                    document.getElementById('tabContent1').classList.add('hidden'); // Ensure it's hidden before showing

                    // Activate the clicked tab button
                    button.classList.add('active');
                    // Show the corresponding tab content
                    document.getElementById('tabContent1').classList.remove('hidden');

                    // Update lookbook when its tab is active
                    updateLookbookModule();
                });
            });

            // Image download functionality using html2canvas
            downloadContentButton.addEventListener('click', function() {
                let moduleToDownload = lookbookModule; // Only Module 1 now

                downloadContentButton.style.display = 'none';
                updatePreviewButton.style.display = 'none';

                html2canvas(moduleToDownload, {
                    scale: 2,
                    useCORS: true,
                    logging: false
                }).then(function(canvas) {
                    downloadContentButton.style.display = 'block';
                    updatePreviewButton.style.display = 'block';

                    const imageDataURL = canvas.toDataURL('image/png');
                    const link = document.createElement('a');
                    link.href = imageDataURL;
                    link.download = `product_content.png`; // Simplified filename
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showMessageBox('콘텐츠 이미지가 저장되었습니다!');
                }).catch(function(error) {
                    console.error('이미지 저장 중 오류 발생:', error);
                    downloadContentButton.style.display = 'block';
                    updatePreviewButton.style.display = 'block';
                    showMessageBox('이미지 저장에 실패했습니다. 다시 시도해주세요.');
                });
            });

            // --- Initial Render ---
            renderProductInfoToggles();
            renderProductSelectionDropdowns(); // Renders dropdown for Module 1
            updateContentCreationInputsModule1(); // Initialize module 1 inputs
            updateLookbookModule(); // Initial update for module 1 (default active)
        });
    </script>
</body>
</html>
